<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Silk Road Atlas: explore 2,000+ heritage sites across Uzbekistan and compare camel-caravan travel times with modern roads, powered by Amazon Location Service." />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' blob:; worker-src blob: 'self'; child-src blob: 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.amazonaws.com https://*.wikimedia.org https://upload.wikimedia.org https://thumb.wikimedia.org https://tile.openstreetmap.org; font-src 'self' data: https://*.amazonaws.com; connect-src 'self' https://*.amazonaws.com https://*.wikimedia.org https://*.wikipedia.org https://demotiles.maplibre.org https://tile.openstreetmap.org; base-uri 'self'; form-action 'self';" />
    <title>Silk Road Atlas — Uzbekistan Cultural Heritage & Caravan Journey Explorer</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐫</text></svg>" />
  </head>
  <body>
    <aside id="sidebar" class="sidebar">
      <header class="brand">
        <button id="toggle-sidebar" class="icon-btn mobile-only" aria-label="Toggle panel">☰</button>
        <div class="brand-hero">
          <img src="/hero-banner.jpg" alt="Silk Road Atlas" class="brand-hero-img" />
          <div class="brand-hero-overlay"></div>
          <div class="brand-hero-badge">✦ AWS Location Hackathon 2026</div>
        </div>
        <div class="brand-content">
          <div class="brand-title-row">
            <h1>🐫 Silk Road Atlas</h1>
            <span class="live-pill" title="Connected to Amazon Location Service v2">● AWS Live</span>
          </div>
          <p class="tagline">What took a camel caravan a month takes a modern car an afternoon.</p>
        </div>
      </header>

      <div id="stats" class="stats" aria-live="polite"></div>

      <nav class="tabs" role="tablist">
        <button role="tab" data-tab="explore" class="active">🧭 Explore</button>
        <button role="tab" data-tab="story">🐫 Caravan Story</button>
        <button role="tab" data-tab="trip">🗺️ Trip <span id="trip-count" class="badge">0</span></button>
        <button role="tab" data-tab="reach">⏱️ Reach</button>
      </nav>

      <section id="panel-explore" class="panel active" role="tabpanel"></section>
      <section id="panel-story" class="panel" role="tabpanel"></section>
      <section id="panel-trip" class="panel" role="tabpanel"></section>
      <section id="panel-reach" class="panel" role="tabpanel"></section>

      <footer class="footer">
        <div class="footer-attribution">
          <span>Data © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a> (ODbL)</span>
          <span>Maps &amp; Routes by <strong>Amazon Location Service</strong></span>
        </div>
        <div class="footer-links">
          <a href="https://github.com/Rajabov0828/silk-road-atlas" id="repo-link" class="github-badge" target="_blank" rel="noopener noreferrer">
            <svg height="14" width="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
              <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
            </svg>
            <span>GitHub: Rajabov0828/silk-road-atlas ↗</span>
          </a>
        </div>
      </footer>
    </aside>
    <main id="map" aria-label="Map of heritage sites in Uzbekistan"></main>
    <div id="toast" class="toast" role="status"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
